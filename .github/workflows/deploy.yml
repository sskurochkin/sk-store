name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
    steps:
      - name: Validate deploy configuration
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::Set DEPLOY_HOST, DEPLOY_USER, and DEPLOY_PATH secrets"
            exit 1
          fi
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_KEY_B64" ]; then
            echo "::error::Set DEPLOY_SSH_KEY (raw private key) or DEPLOY_SSH_KEY_B64 (base64, recommended)"
            exit 1
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::Private key is invalid. Paste the full OpenSSH private key (BEGIN/END lines) or use DEPLOY_SSH_KEY_B64."
            exit 1
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Git pull on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -euxo pipefail
          cd "${DEPLOY_PATH}"
          test -f .env.production
          docker compose version
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "==> Git at: \$(git log -1 --oneline)"
          EOF

      - name: Database backup (best-effort)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -euxo pipefail
          cd "${DEPLOY_PATH}"
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"
          mkdir -p ~/backups
          BACKUP_FILE=~/backups/skstore-\$(date +%Y%m%d-%H%M%S).dump
          CONTAINER_DUMP=/tmp/skstore-backup.dump
          echo "==> Database backup (best-effort)"
          if \$COMPOSE exec -T postgres pg_dump -U skstore_app -d skstore --no-owner --format=custom -f "\$CONTAINER_DUMP" \\
            && \$COMPOSE cp "postgres:\$CONTAINER_DUMP" "\$BACKUP_FILE" \\
            && \$COMPOSE exec -T postgres rm -f "\$CONTAINER_DUMP"; then
            echo "==> Backup OK: \$BACKUP_FILE (\$(wc -c < "\$BACKUP_FILE") bytes)"
          else
            echo "::warning::Backup failed or skipped — continuing deploy"
            \$COMPOSE exec -T postgres rm -f "\$CONTAINER_DUMP" 2>/dev/null || true
          fi
          EOF

      - name: Build, migrate, and start
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -euxo pipefail
          cd "${DEPLOY_PATH}"
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

          echo "==> Docker build (may take several minutes)"
          export DOCKER_BUILDKIT=1
          \$COMPOSE build --progress=plain

          echo "==> Prisma migrate deploy"
          \$COMPOSE run --rm backend npx prisma migrate deploy

          echo "==> Docker up (same session as build — force-recreate app containers)"
          \$COMPOSE up -d --force-recreate --wait backend frontend

          echo "==> Container status"
          \$COMPOSE ps

          FRONTEND_IMAGE="\$(docker inspect sk-store-prod-frontend-1 --format '{{.Image}}' 2>/dev/null || true)"
          LATEST_IMAGE="\$(docker images sk-store-prod-frontend --format '{{.ID}}' | head -1)"
          echo "==> Frontend container image: \${FRONTEND_IMAGE}"
          echo "==> Frontend latest image:    \${LATEST_IMAGE}"
          if [ -n "\$FRONTEND_IMAGE" ] && [ -n "\$LATEST_IMAGE" ] && ! echo "\$FRONTEND_IMAGE" | grep -q "\$LATEST_IMAGE"; then
            echo "::error::Frontend container is not running the latest built image"
            exit 1
          fi
          echo "==> Frontend image verified"
          EOF

      - name: Smoke tests
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -euxo pipefail
          wait_for_url() {
            local url="\$1"
            local attempts=30
            local i=1
            while [ "\$i" -le "\$attempts" ]; do
              if curl -fsS "\$url" >/dev/null 2>&1; then
                echo "OK: \$url"
                return 0
              fi
              echo "Waiting for \$url (\$i/\$attempts)..."
              sleep 3
              i=\$((i + 1))
            done
            echo "Timeout: \$url"
            return 1
          }
          echo "==> Smoke test: homepage"
          wait_for_url http://127.0.0.1:3000/ || echo "::warning::Homepage smoke test failed"
          echo "==> Smoke test: /api/health"
          wait_for_url http://127.0.0.1:3000/api/health || echo "::warning::Health smoke test failed"
          echo "==> Prune old images"
          cd "${DEPLOY_PATH}"
          docker image prune -f
          echo "==> Deploy finished successfully"
          EOF
