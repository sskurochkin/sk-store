name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
    steps:
      - name: Validate deploy configuration
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::error::Set DEPLOY_HOST, DEPLOY_USER, and DEPLOY_PATH secrets"
            exit 1
          fi
          if [ -z "$SSH_KEY" ] && [ -z "$SSH_KEY_B64" ]; then
            echo "::error::Set DEPLOY_SSH_KEY (raw private key) or DEPLOY_SSH_KEY_B64 (base64, recommended)"
            exit 1
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::Private key is invalid. Paste the full OpenSSH private key (BEGIN/END lines) or use DEPLOY_SSH_KEY_B64."
            exit 1
          fi
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
          set -euxo pipefail

          echo "==> Deploy started"
          echo "==> User: \$(whoami)"
          echo "==> Host: \$(hostname -f 2>/dev/null || hostname)"

          cd "${DEPLOY_PATH}"
          echo "==> Working directory: \$(pwd)"

          echo "==> Checking .env.production"
          test -f .env.production

          echo "==> Checking docker"
          docker compose version

          echo "==> Git fetch and pull"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "==> Git at: \$(git log -1 --oneline)"

          echo "==> Database backup (best-effort, deploy continues on failure)"
          mkdir -p ~/backups
          BACKUP_FILE=~/backups/skstore-\$(date +%Y%m%d-%H%M%S).dump
          if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres \\
            pg_dump -U skstore_app -d skstore --no-owner --format=custom > "\$BACKUP_FILE"; then
            echo "==> Backup OK: \$BACKUP_FILE"
          else
            echo "::warning::Backup failed or skipped — continuing deploy"
          fi

          echo "==> Docker build"
          export DOCKER_BUILDKIT=1
          docker compose -f docker-compose.prod.yml --env-file .env.production build --progress=plain

          echo "==> Prisma migrate deploy"
          docker compose -f docker-compose.prod.yml --env-file .env.production run --rm backend npx prisma migrate deploy

          echo "==> Docker up"
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d --wait

          echo "==> Container status"
          docker compose -f docker-compose.prod.yml --env-file .env.production ps

          wait_for_url() {
            local url="\$1"
            local attempts=30
            local i=1
            while [ "\$i" -le "\$attempts" ]; do
              if curl -fsS "\$url" >/dev/null 2>&1; then
                echo "OK: \$url"
                return 0
              fi
              echo "Waiting for \$url (\$i/\$attempts)..."
              sleep 3
              i=\$((i + 1))
            done
            echo "Timeout: \$url"
            return 1
          }

          echo "==> Smoke test: homepage"
          wait_for_url http://127.0.0.1:3000/ || echo "::warning::Homepage smoke test failed"

          echo "==> Smoke test: /api/health"
          wait_for_url http://127.0.0.1:3000/api/health || echo "::warning::Health smoke test failed"

          echo "==> Prune old images"
          docker image prune -f

          echo "==> Deploy finished successfully"
          EOF
